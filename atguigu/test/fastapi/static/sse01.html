<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<button id="btn">点击我开始发邮件</button>
<div id="content"></div>


<script>
    const btn = document.getElementById("btn")
    btn.onclick = async function () {
        const res = await fetch("http://localhost:8000/send_email?session_id=123456")
        data = await res.json()
        console.log(data)

        const es = new EventSource("http://localhost:8000/sse01?session_id=123456")
        es.onmessage = function (e) {
            if (e.data === "None") {
                es.close()
                return
            }
            document.getElementById('content').innerHTML += e.data +"<br/>"
        }
    }

</script>



</body>
</html>
